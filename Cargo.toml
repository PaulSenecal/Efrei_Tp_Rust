[package]
name = "rust-map-simulation"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serveur web
actix-web = "4"
actix-files = "0.6"

# Sérialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Génération procédurale
noise = "0.8"
rand = "0.8"
rand_pcg = "0.3"

# Logging
env_logger = "0.10"
log = "0.4"

[dev-dependencies]
cargo-watch = "8"